events { }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable gzip for faster loads (especially important for WASM)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # ──────────────────────────────────────────────────────────────
    # CORS: Permissive for dev/test – allow ANY origin
    # (Comment out or remove the map when going to production)
    # ──────────────────────────────────────────────────────────────
    # map $http_origin $cors_origin {
    #     ~^https?://(localhost|127\.0\.0\.1)(:\d+)?$               $http_origin;
    #     ^https://dispatch\.vandersluistrucking\.com$             $http_origin;
    #     default "";
    # }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            # SPA fallback
            try_files $uri $uri/ /index.html =404;

            # Handle OPTIONS preflight – fully permissive
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'      '*' always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept,Origin,X-Auth-Token' always;
                add_header 'Access-Control-Max-Age'           1728000 always;
                add_header 'Content-Type'                     'text/plain; charset=utf-8';
                add_header 'Content-Length'                   0;
                return 204;
            }

            # Add permissive CORS to all successful responses
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,ETag' always;
            # Optional: only add if you actually send credentials (cookies, auth headers)
            # add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        location = /version.json {
            # Handle OPTIONS preflight for this exact path
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'      '*' always;
                add_header 'Access-Control-Allow-Methods'     'GET, OPTIONS' always;  # GET is what follows
                add_header 'Access-Control-Allow-Headers'     'cache-control, pragma, accept, origin' always;
                add_header 'Access-Control-Max-Age'           1728000 always;
                add_header 'Content-Type'                     'text/plain; charset=utf-8';
                add_header 'Content-Length'                   0;
                return 204;
            }

            # Normal GET response – no-cache as before
            add_header 'Cache-Control' 'no-cache, no-store, must-revalidate' always;
            add_header 'Pragma' 'no-cache' always;
            add_header 'Expires' '0' always;
            add_header 'Access-Control-Allow-Origin' '*' always;

            # Serve the file (nginx will auto-add content-type application/json if mime.types include it)
            try_files $uri =404;
        }

        # Blazor WebAssembly framework files - critical for loading
        location ~* (^/_framework/|blazor\.webassembly\.js|blazor\.boot\.json) {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            access_log off;

            # Try pre-compressed versions first (if they exist)
            # Note: alpine nginx image may not have brotli module.
            # If using a different nginx image with brotli, enable:
            # brotli_static on;
            gzip_static on;
        }

        # Other compressed WASM / DLL assets
        location ~* \.(wasm|dll|dat)(\.br|\.gz)?$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            gzip_static on;
        }

        # Security headers (global – unchanged)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}