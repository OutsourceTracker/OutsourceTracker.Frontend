events { }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable gzip for faster loads (especially important for WASM)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # ──────────────────────────────────────────────────────────────
    # CORS: Permissive for dev/test – allow ANY origin
    # (Comment out or remove the map when going to production)
    # ──────────────────────────────────────────────────────────────
    # map $http_origin $cors_origin {
    #     ~^https?://(localhost|127\.0\.0\.1)(:\d+)?$               $http_origin;
    #     ^https://dispatch\.vandersluistrucking\.com$             $http_origin;
    #     default "";
    # }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            # SPA fallback
            try_files $uri $uri/ /index.html =404;

            # Handle OPTIONS preflight – fully permissive
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'      '*' always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept,Origin,X-Auth-Token' always;
                add_header 'Access-Control-Max-Age'           1728000 always;
                add_header 'Content-Type'                     'text/plain; charset=utf-8';
                add_header 'Content-Length'                   0;
                return 204;
            }

            # Add permissive CORS to all successful responses
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,ETag' always;
            # Optional: only add if you actually send credentials (cookies, auth headers)
            # add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # Long-term caching for immutable Blazor assets
        # (unchanged – good for prod, but see below for dev override if needed)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|dll)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            access_log off;  # optional, reduces log noise
        }

        # Blazor framework files
        location ~* ^/_framework/ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            access_log off;  # optional, reduces log noise
        }

        # Force no-cache on version.json (good for forcing version checks)
        location = /version.json {
            add_header 'Cache-Control' 'no-cache, no-store, must-revalidate' always;
            add_header 'Pragma' 'no-cache' always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            expires -1;
        }

        # Security headers (global – unchanged)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}