events { }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable gzip for faster loads (especially important for WASM)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # ──────────────────────────────────────────────────────────────
    # CORS origin mapping – MUST be in http {} context
    # ──────────────────────────────────────────────────────────────
    map $http_origin $cors_origin {
        ~^https?://(localhost|127\.0\.0\.1)(:\d+)?$               $http_origin;
        ^https://dispatch\.vandersluistrucking\.com$             $http_origin;
        default "";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            # SPA fallback
            try_files $uri $uri/ /index.html =404;

            # Handle OPTIONS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'      '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age'           1728000 always;
                add_header 'Content-Type'                     'text/plain; charset=utf-8';
                add_header 'Content-Length'                   0;
                return 204;
            }

            # Add CORS to successful responses
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        }

        # Long-term caching for immutable Blazor assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|dll)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }

        # Blazor framework files
        location ~* ^/_framework/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }

        # Force no-cache on version.json
        location = /version.json {
            add_header 'Cache-Control' 'no-cache, no-store, must-revalidate' always;
            add_header 'Pragma' 'no-cache' always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            expires -1;
        }

        # Security headers (global to this server block)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}