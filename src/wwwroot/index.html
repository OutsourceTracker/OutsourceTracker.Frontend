<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a" />

    <!-- App -->
    <title>OutsourceTracker</title>
    <base href="/" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />

    <!-- Styles -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="OutsourceTracker.Frontend.styles.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />

    <script type="importmap"></script>

    <!-- Site Scripts -->
    <script src="js/site.js" defer></script>
</head>

<body style="margin: 0; padding: 0; height: 100vh; overflow: hidden; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div id="app">
        <!-- Enhanced Loading Screen -->
        <div class="startup-loader">
            <div class="loader-container">
                <div class="modern-spinner"></div>
                <div class="loading-text">Loading OutsourceTracker...</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <span>An unexpected error has occurred.</span>
        <div class="actions">
            <a href="" class="reload">Reload</a>
            <button type="button" class="dismiss" aria-label="Dismiss error">✕</button>
        </div>
    </div>

    <!-- MudBlazor -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <!-- Blazor -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
