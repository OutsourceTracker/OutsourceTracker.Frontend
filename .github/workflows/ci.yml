name: Build & Publish OutsourceTracker.Frontend to MyGet & Docker

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    uses: OutsourceTracker/OutsourceTracker.Actions/.github/workflows/build-dotnet.yml@master
    with:
      dotnet-version: '10.0.x'
      project-path: 'src/OutsourceTracker.Frontend.csproj'
      publish-blazor: true
      artifact-name: wwwroot

  publish-docker:
    if: github.event_name != 'pull_request'
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate wwwroot/version.json
        run: |
          # Use the semver output from the reusable workflow
          SEMVER="${{ needs.build-frontend.outputs.gitversion-semver }}"
          
          # Fallback in case output is empty/missing (rare)
          if [ -z "$SEMVER" ]; then
            SEMVER="unknown-$(git rev-parse --short HEAD)"
          fi
          
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BRANCH="${{ github.ref_name }}"
          
          # Create the file in the publish location (adjust path if needed)
          mkdir -p src/wwwroot   # safe if directory already exists
          
          cat > src/wwwroot/version.json <<EOF
          {
            "version": "$SEMVER",
            "commit": "$SHORT_SHA",
            "built": "$BUILD_TIMESTAMP",
            "branch": "$BRANCH",
            "buildId": "${{ github.run_id }}"
          }
          EOF
          
          echo "Generated version.json:"
          cat src/wwwroot/version.json

      - name: Download Blazor Publish Artifact
        uses: actions/download-artifact@v4
        with:
          name: wwwroot
          path: ./src/prebuilt-publish

      - name: Prepare prebuilt-publish for Dockerfile
        run: |
          # The reusable workflow uploads the full publish output.
          # This results in the structure:
          #   prebuilt-publish/
          #     wwwroot/
          #       _framework/
          #         blazor.webassembly.*.js
          #         ...
          #
          # The Dockerfile does:
          #   cp -r prebuilt-publish/* /app/publish/
          # followed by
          #   COPY --from=build /app/publish/wwwroot /usr/share/nginx/html
          #
          # So we must preserve the wwwroot folder — do NOT flatten it.

          echo "Structure under prebuilt-publish after download:"
          ls -la ./src/prebuilt-publish/ 2>/dev/null || echo "(directory missing or empty)"

          if [ -d "./src/prebuilt-publish/wwwroot/_framework" ]; then
            echo "Contents of prebuilt-publish/wwwroot/_framework/:"
            ls -la ./src/prebuilt-publish/wwwroot/_framework/ | head -20
          else
            echo "WARNING: No wwwroot/_framework directory found under prebuilt-publish"
          fi

          # Verify the critical Blazor WebAssembly loader (user only wants this check, not boot.json)
          if ls ./src/prebuilt-publish/wwwroot/_framework/blazor.webassembly*.js 1>/dev/null 2>&1; then
            echo "✓ blazor.webassembly.js (or fingerprinted variant) found in artifact"
          else
            echo "✗ ERROR: blazor.webassembly.js not found under prebuilt-publish/wwwroot/_framework/"
            echo "This will cause the Docker build to fail or the site to 404 at runtime."
            ls -la ./src/prebuilt-publish/wwwroot/_framework/ 2>/dev/null || true
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS="ghcr.io/$REPO_LOWER:${{ needs.build-frontend.outputs.gitversion-semver }}"
          if [ "${{ github.ref_name }}" = "master" ]; then
            TAGS="$TAGS,ghcr.io/$REPO_LOWER:latest"
          fi
          echo "IMAGE_TAGS=$TAGS" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          build-args: |
            VERSION=${{ needs.build-frontend.outputs.gitversion-semver }}
            ASSEMBLY_VERSION=${{ needs.build-frontend.outputs.gitversion-assemblysemver }}
            FILE_VERSION=${{ needs.build-frontend.outputs.gitversion-assemblysemfilever }}
            INFORMATIONAL_VERSION=${{ needs.build-frontend.outputs.gitversion-informationalversion }}
            ENABLE_BROTLI=true